name: Release

# Tag-driven: `git tag v1.1 && git push origin v1.1` builds, signs, and
# publishes. The manual trigger builds and signs the same way but uploads the
# APK as a workflow artifact instead of publishing a release, which is how you
# test a signing-secret change without burning a version number.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # There is no Gradle wrapper in this repo, so the version is pinned here
      # rather than resolved from gradle-wrapper.properties.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          build-root-directory: android

      # versionName has to match the tag or the in-app updater will keep
      # offering a build the user already has. versionCode just needs to climb.
      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Building ${name} (code ${GITHUB_RUN_NUMBER})"

      # The keystore only ever exists on the runner's temp disk.
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. See README for the four required secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      # The updater picks the first asset whose name ends in .apk, so the exact
      # name is free — but it is the thing the user downloads, so make it read
      # like the app and not like `app-release.apk`.
      - name: Name the asset
        id: apk
        run: |
          src=android/app/build/outputs/apk/release/app-release.apk
          dst="ukc-crag-viewer-${{ steps.version.outputs.name }}.apk"
          mv "$src" "$dst"
          echo "path=$dst" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          # Re-running a tag should replace the asset, not fail on a release
          # that already exists.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

      - name: Upload artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ukc-crag-viewer-apk
          path: ${{ steps.apk.outputs.path }}
